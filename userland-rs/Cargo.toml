[package]
name = "tcmk-userland"
version = "0.1.0"
edition = "2021"

# Her uygulama ayri bir ikili; ortak kod `tcmk` kutuphanesinde.
[lib]
name = "tcmk"
path = "src/lib.rs"

# `src/bin/` kendiliginden ELF uygulamalarini tanimlar. Windows (PE32)
# uygulamalari `src/win/` altindadir ve ayrica bildirilir: yalnizca
# `i686-tcmk-win` hedefiyle derlenirler, cunku `tcmk::win32` modulu
# yalnizca o hedefte vardir (bkz. lib.rs).
[[bin]]
name = "winclock"
path = "src/win/clock.rs"

[[bin]]
name = "winpad"
path = "src/win/notepad.rs"

[[bin]]
name = "winfiles"
path = "src/win/explorer.rs"

[[bin]]
name = "winenv"
path = "src/win/envtest.rs"

[[bin]]
name = "quoted"
path = "src/bin/quoted.rs"

[[bin]]
name = "winprobe"
path = "src/win/probe.rs"

[[bin]]
name = "winmods"
path = "src/win/modules.rs"

[[bin]]
name = "winargv"
path = "src/win/argv.rs"

[[bin]]
name = "winseh"
path = "src/win/seh.rs"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
